spring:
  application:
    name: parksys

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/parksys}
    username: ${DB_USER:parksys}
    password: ${DB_PASSWORD:parksys123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html